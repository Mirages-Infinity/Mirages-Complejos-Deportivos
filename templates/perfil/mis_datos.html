{% extends 'base.html' %}
{% block title %}Mis Datos{% endblock %}

{% block header_left %}
<a href="{% url 'perfil' %}"
   style="width:34px;height:34px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#4b5563;">
  <svg xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
  </svg>
</a>
{% endblock %}

{% block content %}
<div class="w-full max-w-2xl mx-auto flex flex-col flex-1 pb-24">



  <form method="post" style="padding:20px 16px 0;">
    {% csrf_token %}

    <div style="background:white;border-radius:16px;border:0.5px solid #e5e7eb;overflow:hidden;margin-bottom:16px;">

      <div style="padding:12px 16px;border-bottom:0.5px solid #e5e7eb;">
        <label style="display:block;font-size:0.72rem;color:#9ca3af;margin-bottom:4px;">Nombre</label>
        <input type="text" name="nombre" value="{{ request.user.first_name }}" required
               style="width:100%;font-size:0.875rem;font-weight:500;color:#1c1b1f;border:none;outline:none;background:transparent;">
      </div>

      <div style="padding:12px 16px;border-bottom:0.5px solid #e5e7eb;">
        <label style="display:block;font-size:0.72rem;color:#9ca3af;margin-bottom:4px;">Apellido</label>
        <input type="text" name="apellido" value="{{ request.user.last_name }}"
               style="width:100%;font-size:0.875rem;font-weight:500;color:#1c1b1f;border:none;outline:none;background:transparent;">
      </div>

      <div style="padding:12px 16px;border-bottom:0.5px solid #e5e7eb;">
        <label style="display:block;font-size:0.72rem;color:#9ca3af;margin-bottom:4px;">Teléfono</label>
        <input type="tel" name="telefono" value="{{ perfil_obj.telefono }}"
               style="width:100%;font-size:0.875rem;font-weight:500;color:#1c1b1f;border:none;outline:none;background:transparent;">
      </div>

      <div style="padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div style="flex:1;min-width:0;">
          <label style="display:block;font-size:0.72rem;color:#9ca3af;margin-bottom:4px;">Correo electrónico</label>
          <p style="font-size:0.875rem;color:#6b7280;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ request.user.email }}</p>
        </div>
        <a href="{% url 'cambiar_email' %}"
           style="flex-shrink:0;font-size:0.75rem;font-weight:500;padding:9px 16px;border-radius:8px;border:0.5px solid #e5e7eb;color:#374151;text-decoration:none;background:white;">
          Cambiar
        </a>
      </div>

    </div>

    <button type="submit"
            style="width:100%;padding:10px 20px;border-radius:8px;background:#1c1b1f;color:white;font-weight:500;font-size:0.9rem;border:none;cursor:pointer;">
      Guardar cambios
    </button>
  </form>

</div>
{% endblock %}
