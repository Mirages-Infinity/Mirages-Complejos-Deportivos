{% extends 'base.html' %}
{% block title %}Cambiar contraseña{% endblock %}

{% block header_left %}
<a href="{% url 'perfil' %}"
   style="width:34px;height:34px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#4b5563;">
  <svg xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
  </svg>
</a>
{% endblock %}

{% block content %}
<div class="w-full max-w-2xl mx-auto flex flex-col flex-1 pb-24" style="padding:20px 16px 0;">

  <p style="font-size:0.68rem;font-weight:500;color:#9ca3af;text-transform:uppercase;letter-spacing:0.09em;margin-bottom:2px;">Cuenta</p>
  <h1 style="font-size:1.35rem;font-weight:500;color:#1c1b1f;margin-bottom:20px;">Cambiar contraseña</h1>

  <form method="post">
    {% csrf_token %}

    <div style="background:white;border-radius:16px;border:0.5px solid #e5e7eb;overflow:hidden;margin-bottom:20px;">
      <div style="padding:12px 16px;border-bottom:0.5px solid #e5e7eb;">
        <label style="display:block;font-size:0.72rem;color:#9ca3af;margin-bottom:4px;">Contraseña actual</label>
        <div style="position:relative;">
          <input type="password" id="clave_actual" name="clave_actual" required autofocus placeholder="••••••••"
                 style="width:100%;font-size:0.875rem;font-weight:500;color:#1c1b1f;border:none;outline:none;background:transparent;padding-right:34px;">
          <button type="button" data-toggle-password="clave_actual"
                  style="position:absolute;right:0;top:50%;transform:translateY(-50%);color:#9ca3af;background:none;border:none;cursor:pointer;padding:0 2px;">
            <svg data-eye-on="clave_actual" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg data-eye-off="clave_actual" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;display:none;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 012.199-3.658M6.228 6.228A9.97 9.97 0 0112 5c4.477 0 8.268 2.943 9.542 7a9.97 9.97 0 01-1.93 3.314M6.228 6.228L3 3m3.228 3.228l3.65 3.65M17.772 17.772l3.228 3.228m-3.228-3.228l-3.65-3.65" />
            </svg>
          </button>
        </div>
      </div>
      <div style="padding:12px 16px;border-bottom:0.5px solid #e5e7eb;">
        <label style="display:block;font-size:0.72rem;color:#9ca3af;margin-bottom:4px;">Nueva contraseña</label>
        <div style="position:relative;">
          <input type="password" id="nueva_clave" name="nueva_clave" required minlength="6" placeholder="Mínimo 6 caracteres"
                 style="width:100%;font-size:0.875rem;font-weight:500;color:#1c1b1f;border:none;outline:none;background:transparent;padding-right:34px;">
          <button type="button" data-toggle-password="nueva_clave"
                  style="position:absolute;right:0;top:50%;transform:translateY(-50%);color:#9ca3af;background:none;border:none;cursor:pointer;padding:0 2px;">
            <svg data-eye-on="nueva_clave" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg data-eye-off="nueva_clave" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;display:none;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 012.199-3.658M6.228 6.228A9.97 9.97 0 0112 5c4.477 0 8.268 2.943 9.542 7a9.97 9.97 0 01-1.93 3.314M6.228 6.228L3 3m3.228 3.228l3.65 3.65M17.772 17.772l3.228 3.228m-3.228-3.228l-3.65-3.65" />
            </svg>
          </button>
        </div>
      </div>
      <div style="padding:12px 16px;">
        <label style="display:block;font-size:0.72rem;color:#9ca3af;margin-bottom:4px;">Repetir nueva contraseña</label>
        <div style="position:relative;">
          <input type="password" id="nueva_clave2" name="nueva_clave2" required minlength="6" placeholder="••••••••"
                 style="width:100%;font-size:0.875rem;font-weight:500;color:#1c1b1f;border:none;outline:none;background:transparent;padding-right:34px;">
          <button type="button" data-toggle-password="nueva_clave2"
                  style="position:absolute;right:0;top:50%;transform:translateY(-50%);color:#9ca3af;background:none;border:none;cursor:pointer;padding:0 2px;">
            <svg data-eye-on="nueva_clave2" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg data-eye-off="nueva_clave2" xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;display:none;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 012.199-3.658M6.228 6.228A9.97 9.97 0 0112 5c4.477 0 8.268 2.943 9.542 7a9.97 9.97 0 01-1.93 3.314M6.228 6.228L3 3m3.228 3.228l3.65 3.65M17.772 17.772l3.228 3.228m-3.228-3.228l-3.65-3.65" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <button type="submit"
            style="width:100%;padding:10px 20px;border-radius:8px;background:#1c1b1f;color:white;font-weight:500;font-size:0.9rem;border:none;cursor:pointer;">
      Cambiar contraseña
    </button>
  </form>

</div>

<script>
  document.querySelectorAll('[data-toggle-password]').forEach((button) => {
    button.addEventListener('click', function () {
      const targetId = this.getAttribute('data-toggle-password');
      const input = document.getElementById(targetId);
      const eyeOn = document.querySelector(`[data-eye-on="${targetId}"]`);
      const eyeOff = document.querySelector(`[data-eye-off="${targetId}"]`);

      if (input.type === 'password') {
        input.type = 'text';
        eyeOn.style.display = 'none';
        eyeOff.style.display = 'block';
      } else {
        input.type = 'password';
        eyeOn.style.display = 'block';
        eyeOff.style.display = 'none';
      }
    });
  });
</script>
{% endblock %}
