<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Redirigiendo a Webpay...</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f3f4f6; margin: 0; flex-direction: column; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1c1b1f; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { color: #374151; font-weight: 500; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Redirigiendo a Webpay, por favor espera...</p>
    
    <form id="webpay-form" action="{{ url }}" method="POST">
        <input type="hidden" name="token_ws" value="{{ token_ws }}">
    </form>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("webpay-form").submit();
        });
    </script>
</body>
</html>
