{# Partial: modal + JS para crear reservas como admin. Requiere variable cancha_id. #}
<div id="modal-crear-reserva" class="fixed inset-0 z-50 hidden items-center justify-center p-4" role="dialog" aria-modal="true">
  <div class="absolute inset-0" style="background:rgba(17,24,39,0.6);backdrop-filter:blur(4px);" onclick="cerrarModalCrearReserva()"></div>
  <div style="position:relative;background:white;width:100%;max-width:384px;border-radius:20px;border:0.5px solid #e5e7eb;overflow:hidden;display:flex;flex-direction:column;">
    <div style="padding:20px 24px;border-bottom:0.5px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="width:40px;height:40px;border-radius:12px;background:#eff6ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <svg xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px;color:#2563eb;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="10" x2="21" y2="10"></line>
            <line x1="12" y1="14" x2="12" y2="19"></line>
            <line x1="9.5" y1="16.5" x2="14.5" y2="16.5"></line>
          </svg>
        </span>
        <div>
          <p style="font-size:0.9rem;font-weight:500;color:#1c1b1f;line-height:1.2;">Crear reserva</p>
          <p style="font-size:0.72rem;color:#9ca3af;font-weight:400;margin-top:2px;" id="crv-fecha-hora">--</p>
        </div>
      </div>
      <button onclick="cerrarModalCrearReserva()" style="padding:8px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:#9ca3af;display:flex;align-items:center;justify-content:center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div style="padding:20px 24px;display:flex;flex-direction:column;gap:16px;">

      <!-- Tipo de reserva -->
      <div>
        <label style="display:block;font-size:0.68rem;font-weight:500;color:#9ca3af;text-transform:uppercase;letter-spacing:0.09em;margin-bottom:6px;">Tipo de reserva</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <button type="button" id="crv-tipo-personal" onclick="setTipoReserva('personal')"
            style="padding:10px;border-radius:8px;border:0.5px solid #e5e7eb;background:white;color:#6b7280;font-size:0.73rem;font-weight:500;cursor:pointer;">
            Personal
          </button>
          <button type="button" id="crv-tipo-organizacion" onclick="setTipoReserva('organizacion')"
            style="padding:10px;border-radius:8px;border:0.5px solid #e5e7eb;background:white;color:#6b7280;font-size:0.73rem;font-weight:500;cursor:pointer;">
            Organización
          </button>
        </div>
      </div>

      <!-- Campos solo para tipo personal -->
      <div id="crv-campos-personal">
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div>
            <label style="display:block;font-size:0.68rem;font-weight:500;color:#9ca3af;text-transform:uppercase;letter-spacing:0.09em;margin-bottom:4px;">Nombre del solicitante</label>
            <input type="text" id="crv-nombre" placeholder="Ej: Juan Pérez"
              style="width:100%;border:0.5px solid #e5e7eb;border-radius:8px;padding:9px 12px;font-size:0.85rem;font-weight:400;color:#374151;background:white;outline:none;box-sizing:border-box;">
          </div>
          <div>
            <label style="display:block;font-size:0.68rem;font-weight:500;color:#9ca3af;text-transform:uppercase;letter-spacing:0.09em;margin-bottom:4px;">RUT (opcional)</label>
            <input type="text" id="crv-rut" placeholder="Ej: 12345678-9"
              style="width:100%;border:0.5px solid #e5e7eb;border-radius:8px;padding:9px 12px;font-size:0.85rem;font-weight:400;color:#374151;background:white;outline:none;box-sizing:border-box;">
          </div>
          <div>
            <label style="display:block;font-size:0.68rem;font-weight:500;color:#9ca3af;text-transform:uppercase;letter-spacing:0.09em;margin-bottom:4px;">Teléfono (opcional)</label>
            <input type="tel" id="crv-telefono" placeholder="Ej: +56912345678"
              style="width:100%;border:0.5px solid #e5e7eb;border-radius:8px;padding:9px 12px;font-size:0.85rem;font-weight:400;color:#374151;background:white;outline:none;box-sizing:border-box;">
          </div>
          <div>
            <label style="display:block;font-size:0.68rem;font-weight:500;color:#9ca3af;text-transform:uppercase;letter-spacing:0.09em;margin-bottom:4px;">Correo (opcional)</label>
            <input type="email" id="crv-email" placeholder="ejemplo@correo.cl"
              style="width:100%;border:0.5px solid #e5e7eb;border-radius:8px;padding:9px 12px;font-size:0.85rem;font-weight:400;color:#374151;background:white;outline:none;box-sizing:border-box;">
          </div>
          <p style="font-size:0.72rem;color:#1a6e30;font-weight:500;background:#d7f3e0;border-radius:8px;padding:8px 12px;">
            La reserva quedará <strong>APROBADA</strong> al instante.
          </p>
        </div>
      </div>

      <!-- Info para tipo organización -->
      <div id="crv-campos-organizacion" class="hidden">
        <p style="font-size:0.78rem;color:#1d4ed8;font-weight:500;background:#eff6ff;border-radius:8px;padding:10px 12px;line-height:1.5;">
          Se abrirá el formulario completo de organización.<br>
          La reserva quedará <strong>pendiente de firma del alcalde</strong>.
        </p>
      </div>

      <div id="crv-error" class="hidden" style="font-size:0.72rem;color:#991b1b;font-weight:500;background:#fee2e2;border-radius:8px;padding:8px 12px;line-height:1.5;"></div>
    </div>

    <div style="padding:16px 24px;background:#f9fafb;border-top:0.5px solid #e5e7eb;display:flex;gap:12px;">
      <button type="button" onclick="cerrarModalCrearReserva()"
        style="flex:1;padding:9px 16px;border-radius:8px;border:0.5px solid #e5e7eb;background:white;color:#6b7280;font-weight:500;font-size:0.78rem;cursor:pointer;">Cancelar</button>
      <button type="button" onclick="confirmarCrearReserva()"
        style="flex:1;padding:9px 16px;border-radius:8px;background:#1a6e30;color:white;font-weight:500;font-size:0.78rem;border:none;cursor:pointer;">Continuar</button>
    </div>
  </div>
</div>

<script>
  (function() {
    const CANCHA_ID = {{ cancha_id }};
    let tipoReservaActual = 'personal';
    let crvFechaActual = null;
    let crvHoraActual = null;

    function getCookieCRV(name) {
      let v = null;
      document.cookie.split(';').forEach(c => {
        c = c.trim();
        if (c.startsWith(name + '=')) v = decodeURIComponent(c.slice(name.length + 1));
      });
      return v;
    }

    window.setTipoReserva = function(tipo) {
      tipoReservaActual = tipo;
      const btnPersonal = document.getElementById('crv-tipo-personal');
      const btnOrg = document.getElementById('crv-tipo-organizacion');
      const camposPersonal = document.getElementById('crv-campos-personal');
      const camposOrg = document.getElementById('crv-campos-organizacion');
      const styleInactivo = 'padding:10px;border-radius:8px;border:0.5px solid #e5e7eb;background:white;color:#6b7280;font-size:0.73rem;font-weight:500;cursor:pointer;';

      if (tipo === 'personal') {
        btnPersonal.setAttribute('style', 'padding:10px;border-radius:8px;border:0.5px solid #1c1b1f;background:#1c1b1f;color:white;font-size:0.73rem;font-weight:500;cursor:pointer;');
        btnOrg.setAttribute('style', styleInactivo);
        camposPersonal.classList.remove('hidden');
        camposOrg.classList.add('hidden');
      } else {
        btnOrg.setAttribute('style', 'padding:10px;border-radius:8px;border:0.5px solid #1c1b1f;background:#1c1b1f;color:white;font-size:0.73rem;font-weight:500;cursor:pointer;');
        btnPersonal.setAttribute('style', styleInactivo);
        camposPersonal.classList.add('hidden');
        camposOrg.classList.remove('hidden');
      }
    };

    window.abrirModalCrearReserva = function(fechaStr, horaStr, fechaDisplay) {
      crvFechaActual = fechaStr;
      crvHoraActual = horaStr;
      document.getElementById('crv-fecha-hora').textContent = `${fechaDisplay} • ${horaStr}`;
      document.getElementById('crv-nombre').value = '';
      document.getElementById('crv-rut').value = '';
      document.getElementById('crv-telefono').value = '';
      document.getElementById('crv-email').value = '';
      document.getElementById('crv-error').classList.add('hidden');
      window.setTipoReserva('personal');
      const m = document.getElementById('modal-crear-reserva');
      m.classList.remove('hidden'); m.classList.add('flex');
      setTimeout(() => document.getElementById('crv-nombre').focus(), 50);
    };

    window.cerrarModalCrearReserva = function() {
      const m = document.getElementById('modal-crear-reserva');
      m.classList.add('hidden'); m.classList.remove('flex');
    };

    window.confirmarCrearReserva = async function() {
      const err = document.getElementById('crv-error');
      err.classList.add('hidden');

      // Flujo organización: redirigir a formulario completo
      if (tipoReservaActual === 'organizacion') {
        window.cerrarModalCrearReserva();
        const url = `{% url 'crear_reserva_organizacion' %}?cancha_id=${CANCHA_ID}&fecha=${crvFechaActual}&hora=${crvHoraActual}`;
        window.location.href = url;
        return;
      }

      // Flujo personal: creación directa (siempre APROBADA)
      const nombre = document.getElementById('crv-nombre').value.trim();
      const telefono = document.getElementById('crv-telefono').value.trim();
      const email = document.getElementById('crv-email').value.trim();
      if (!nombre) { err.textContent = 'Debes ingresar el nombre del solicitante.'; err.classList.remove('hidden'); return; }

      try {
        const res = await fetch("{% url 'crear_reserva_admin' %}", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookieCRV('csrftoken') },
          body: JSON.stringify({
            cancha_id: CANCHA_ID,
            fecha: crvFechaActual,
            hora: crvHoraActual,
            solicitante_nombre: nombre,
            solicitante_rut: document.getElementById('crv-rut').value.trim(),
            solicitante_telefono: telefono,
            solicitante_email: email,
          })
        });
        const data = await res.json();
        if (data.status === 'success') { window.cerrarModalCrearReserva(); location.reload(); }
        else { err.textContent = data.message || 'No se pudo crear la reserva.'; err.classList.remove('hidden'); }
      } catch (e) { err.textContent = 'Error de conexión.'; err.classList.remove('hidden'); }
    };

    document.addEventListener('keydown', e => { if (e.key === 'Escape') window.cerrarModalCrearReserva(); });
  })();
</script>
