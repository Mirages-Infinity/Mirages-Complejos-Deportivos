{% extends 'base.html' %}
{% block title %}Editar usuario{% endblock %}

{% block header_left %}
<a href="{% url 'panel_usuarios' %}"
   style="width:34px;height:34px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#4b5563;">
  <svg xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
  </svg>
</a>
{% endblock %}


{% block content %}
<div class="w-full max-w-2xl mx-auto flex flex-col flex-1 pb-24" style="padding:20px 16px 0;">

  <p style="font-size:0.68rem;font-weight:500;color:#9ca3af;text-transform:uppercase;letter-spacing:0.09em;margin-bottom:2px;">Panel de administración</p>
  <h1 style="font-size:1.35rem;font-weight:500;color:#1c1b1f;margin-bottom:16px;">Editar usuario</h1>

  <form method="post">
    {% csrf_token %}

    <div style="background:white;border-radius:16px;border:0.5px solid #1c1b1f;overflow:hidden;margin-bottom:16px;">

      <div style="padding:12px 16px;border-bottom:1px solid #1c1b1f;">
        <label style="display:block;font-size:0.72rem;font-weight:500;color:#9ca3af;margin-bottom:4px;">Nombre</label>
        <input type="text" name="nombre" value="{{ u.first_name }}" required
               style="width:100%;font-size:0.875rem;font-weight:500;color:#1c1b1f;border:none;outline:none;background:transparent;">
      </div>

      <div style="padding:12px 16px;border-bottom:1px solid #1c1b1f;">
        <label style="display:block;font-size:0.72rem;font-weight:500;color:#9ca3af;margin-bottom:4px;">Apellido</label>
        <input type="text" name="apellido" value="{{ u.last_name }}"
               style="width:100%;font-size:0.875rem;font-weight:500;color:#1c1b1f;border:none;outline:none;background:transparent;">
      </div>

      <div style="padding:12px 16px;border-bottom:1px solid #1c1b1f;">
        <label style="display:block;font-size:0.72rem;font-weight:500;color:#9ca3af;margin-bottom:4px;">Correo electrónico</label>
        <input type="email" name="email" value="{{ u.email }}" required
               style="width:100%;font-size:0.875rem;font-weight:500;color:#1c1b1f;border:none;outline:none;background:transparent;">
      </div>

      <div style="padding:12px 16px;border-bottom:1px solid #1c1b1f;">
        <label style="display:block;font-size:0.72rem;font-weight:500;color:#9ca3af;margin-bottom:4px;">Teléfono</label>
        <input type="tel" name="telefono" value="{{ perfil_obj.telefono }}"
               style="width:100%;font-size:0.875rem;font-weight:500;color:#1c1b1f;border:none;outline:none;background:transparent;">
      </div>

      <div style="padding:12px 16px;">
        <label style="display:block;font-size:0.72rem;font-weight:500;color:#9ca3af;margin-bottom:4px;">RUT</label>
        <input type="text" name="rut" value="{{ perfil_obj.rut }}" placeholder="12345678-9"
               style="width:100%;font-size:0.875rem;font-weight:500;color:#1c1b1f;border:none;outline:none;background:transparent;">
      </div>

    </div>

    <button type="submit"
            style="width:100%;padding:11px;border-radius:8px;background:#1c1b1f;color:white;font-weight:500;font-size:0.9rem;border:none;cursor:pointer;">
      Guardar cambios
    </button>
  </form>

</div>
{% endblock %}
