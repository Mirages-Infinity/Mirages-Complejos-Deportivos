{% extends 'base.html' %}
{% block title %}Configurar Datos de Transferencia{% endblock %}

{% block header_left %}
<a href="{% url 'panel_inicio' %}"
   style="width:34px;height:34px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#4b5563;">
  <svg xmlns="http://www.w3.org/2000/svg" style="width:18px;height:18px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
  </svg>
</a>
{% endblock %}

{% block content %}
<div class="w-full max-w-lg mx-auto flex flex-col flex-1 pb-24 px-4 sm:px-6 pt-6">
  <div class="mb-6">
    <p class="text-[11px] font-black text-gray-400 uppercase tracking-[0.18em]">Configuración del sistema</p>
    <h1 class="text-2xl font-black text-gray-900 mt-1">Datos bancarios</h1>
  </div>

  <form method="post" class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6 space-y-5">
    {% csrf_token %}
    
    <div>
      <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1 shadow-xs">Nombre del Banco</label>
      <input type="text" name="banco" value="{{ datos.banco }}" required
             class="w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm font-bold text-gray-800 focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Nombre del Titular</label>
      <input type="text" name="titular" value="{{ datos.titular }}" required
             class="w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm font-bold text-gray-800 focus:ring-2 focus:ring-blue-500">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Tipo de Cuenta</label>
        <input type="text" name="tipo_cuenta" value="{{ datos.tipo_cuenta }}" required
               class="w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm font-bold text-gray-800 focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Número de Cuenta</label>
        <input type="text" name="numero_cuenta" value="{{ datos.numero_cuenta }}" required
               class="w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm font-bold text-gray-800 focus:ring-2 focus:ring-blue-500">
      </div>
    </div>

    <div>
      <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">RUT del Titular</label>
      <input type="text" name="rut" value="{{ datos.rut }}" required
             class="w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm font-bold text-gray-800 focus:ring-2 focus:ring-blue-500">
    </div>

    <div>
      <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1">Email para Comprobantes</label>
      <input type="email" name="email" value="{{ datos.email }}" required
             class="w-full bg-gray-50 border-none rounded-2xl px-4 py-3 text-sm font-bold text-gray-800 focus:ring-2 focus:ring-blue-500">
    </div>

    <div class="pt-2">
      <button type="submit" 
              class="w-full bg-gray-900 hover:bg-black text-white font-black py-4 rounded-2xl shadow-lg transition-all text-xs uppercase tracking-widest active:scale-95">
        Guardar cambios
      </button>
    </div>
  </form>
</div>
{% endblock %}
